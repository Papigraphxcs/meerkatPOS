# Light demo limits for the explicitly selected 2 GB host. No build runs here.
services:
  db:
    mem_limit: 512m
    memswap_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
      - --performance-schema=OFF
  backend:
    mem_limit: 768m
    memswap_limit: 1536m
  websocket:
    mem_limit: 128m
    memswap_limit: 256m
  frontend:
    mem_limit: 64m
    memswap_limit: 128m
  redis-cache:
    mem_limit: 64m
    memswap_limit: 128m
  redis-queue:
    mem_limit: 64m
    memswap_limit: 128m
  public:
    mem_limit: 64m
    memswap_limit: 128m
