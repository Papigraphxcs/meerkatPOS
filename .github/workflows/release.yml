name: Generate Semantic Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-xpos
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Validate release token
        run: |
          set -e
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN is missing"
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: "Ali Raza"
          GIT_AUTHOR_EMAIL: "ar.frappe.dev@gmail.com"
          GIT_COMMITTER_NAME: "Ali Raza"
          GIT_COMMITTER_EMAIL: "ar.frappe.dev@gmail.com"
        run: npx semantic-release
