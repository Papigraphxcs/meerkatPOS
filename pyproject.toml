[project]
name = "xpos"
authors = [
    { name = "Ali Raza", email = "ar.frappe.dev@gmail.com"}
]
description = "A modern, offline-capable Point of Sale application for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
keywords = ["frappe", "erpnext", "pos", "point-of-sale", "retail", "offline", "electron", "pwa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Frappe",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "python-barcode>=0.15.1",
    "qrcode[pil]>=7.4",
]

[project.urls]
Homepage = "https://github.com/aliraxa29/xpos"
Repository = "https://github.com/aliraxa29/xpos"
Issues = "https://github.com/aliraxa29/xpos/issues"
Changelog = "https://github.com/aliraxa29/xpos/releases"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=15.40.4,<16.0.0"
erpnext = ">=15.40.4,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B007", # loop control variable not used in loop body
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "C901", # function is too complex
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "F811", # redefinition of unused name
    "F821", # undefined name — false positives in Frappe DF.Literal annotations
    "F823", # local variable referenced before assignment — _ is Frappe translation fn
    "F841", # local variable assigned but never used
    "RUF003", # ambiguous unicode in comments (e.g. EN DASH)
    "RUF005", # list concatenation — prefer explicit form
    "UP030", # use implicit format field references
    "UP035", # deprecated typing imports (Dict/List/Tuple) — kept for clarity
    "UP038", # use X | Y in isinstance — keep tuple form for readability
    "W191", # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F841", "RUF005"]
"**/test_*.py" = ["F841", "RUF005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
